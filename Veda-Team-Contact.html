<title>Veda — Team Contact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a0e1a;
    --navy2: #0f1528;
    --navy3: #151d35;
    --accent: #4d9fff;
    --accent2: #7bbfff;
    --teal: #00d4aa;
    --teal2: #00ffcc;
    --silver: #8899bb;
    --silver2: #aabbdd;
    --text: #ddeeff;
    --text2: #8899cc;
    --glow: rgba(77,159,255,0.15);
    --glow2: rgba(0,212,170,0.12);
    --panel-col: rgba(10,14,26,0.99);
    --panel-bg: linear-gradient(145deg, rgba(10,14,26,0.99), rgba(10,14,26,0.85));
    --panel-border: rgba(77,159,255,0.25);
    --orb: 'Syne', sans-serif;
    --raj: 'Plus Jakarta Sans', sans-serif;
    --exo: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background:
      linear-gradient(rgba(77,159,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,159,255,0.03) 1px, transparent 1px),
      radial-gradient(ellipse at 20% 20%, rgba(77,159,255,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at 80% 80%, rgba(0,212,170,0.07) 0%, transparent 55%),
      var(--navy);
    background-size: 40px 40px, 40px 40px, 100% 100%, 100% 100%, 100%;
    color: var(--text);
    font-family: var(--raj);
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 64px 24px 80px;
  }
  .lockup { display: flex; flex-direction: column; align-items: center; gap: 18px; margin-bottom: 12px; }
  .badge {
    width: 72px; height: 72px; border-radius: 50%;
    box-shadow: 0 0 32px var(--glow), 0 0 60px var(--glow2);
  }
  .badge img { width: 100%; height: 100%; border-radius: 50%; display: block; }
  .wordmark {
    font-family: var(--orb); font-weight: 800; font-size: 1.9rem; letter-spacing: 6px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .kicker {
    font-family: var(--exo); font-size: .72rem; letter-spacing: 3px; text-transform: uppercase;
    color: var(--silver); margin-top: -6px;
  }
  h1 {
    font-family: var(--orb); font-weight: 700; font-size: clamp(1.8rem, 4vw, 2.6rem);
    margin: 28px 0 10px; text-align: center;
  }
  .sub {
    font-family: var(--raj); color: var(--text2); font-size: .98rem;
    max-width: 480px; text-align: center; line-height: 1.6; margin-bottom: 48px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 18px;
    width: 100%;
    max-width: 980px;
  }
  .card {
    background: var(--panel-bg);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 26px 24px;
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    text-align: center;
    position: relative;
    overflow: hidden;
    box-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px rgba(0,0,0,.3);
    transition: transform .2s ease, border-color .2s ease;
  }
  .card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--teal), transparent);
    opacity: .6;
  }
  .card:hover { transform: translateY(-3px); border-color: rgba(77,159,255,0.5); }
  .avatar {
    width: 52px; height: 52px; border-radius: 50%;
    background: rgba(77,159,255,0.08);
    border: 1px solid var(--panel-border);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--orb); font-weight: 700; font-size: 1.15rem; color: var(--accent2);
  }
  .name { font-family: var(--raj); font-weight: 600; font-size: 1.05rem; color: var(--text); }
  .addr { font-family: var(--exo); font-size: .78rem; color: var(--silver); word-break: break-all; }
  .btn {
    margin-top: 4px;
    display: inline-flex; align-items: center; gap: 8px;
    background: linear-gradient(135deg, var(--accent), var(--teal));
    color: var(--navy); text-decoration: none;
    font-family: var(--orb); font-weight: 700; font-size: .68rem;
    letter-spacing: 1.5px; text-transform: uppercase;
    padding: 10px 18px; border-radius: 10px;
    transition: transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(77,159,255,0.35); }
  footer {
    margin-top: 56px; font-family: var(--exo); font-size: .68rem; color: var(--silver);
    letter-spacing: 1px; opacity: .6;
  }
</style>
</head>

  <h1>Get in touch</h1>
  <p class="sub">Reach any of us directly — every card opens a Gmail compose window addressed straight to that inbox.</p>

  <div class="grid" id="grid"></div>

  <footer>veda-net.com</footer>

<script>
  const team = [
    { name: 'Aruna',   email: 'aruna@veda-net.com' },
    { name: 'Vikhyath', email: 'vikhyath@veda-net.com' },
    { name: 'Sahas',   email: 'sahas@veda-net.com' },
    { name: 'Shaun',   email: 'shaun@veda-net.com' },
    { name: 'Keshav',  email: 'keshav@veda-net.com' },
    { name: 'Aaradhya Swami', email: 'aaruswami12@gmail.com' },
    { name: 'Avaneesh Angadi', email: 'avaneesh.angadi14367@gmail.com' },
    { name: 'Manasvi Nalam', email: 'nalammanasvi@gmail.com' },
  ];

  const grid = document.getElementById('grid');
  grid.innerHTML = team.map(p => {
    const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(p.email)}`;
    return `
      <div class="card">
        <div class="avatar">${p.name[0]}</div>
        <div class="name">${p.name}</div>
        <div class="addr">${p.email}</div>
        <a class="btn" href="${gmailUrl}" target="_blank" rel="noopener">Email via Gmail →</a>
      </div>
    `;
  }).join('');
</script>
